<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssuredTest Launch</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 627px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .card {
    width: 1200px;
    height: 627px;
    background: #0a1628;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 90px;
  }

  /* ── NODE GRID BACKGROUND (selective testing metaphor) ── */
  .grid-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  /* subtle radial glow */
  .glow {
    position: absolute;
    width: 900px; height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,200,255,0.10) 0%, transparent 60%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  /* faint grid lines */
  .lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.035) 1px, transparent 1px);
    background-size: 54px 54px;
    z-index: 0;
  }

  /* ── CONTENT ── */
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 980px;
  }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #00c8ff;
    margin-bottom: 30px;
  }

  .headline {
    font-family: 'Syne', sans-serif;
    font-size: 62px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.015em;
    color: #ffffff;
    margin-bottom: 34px;
  }

  .headline .brand {
    color: #00c8ff;
  }

  .tagline {
    font-size: 23px;
    font-weight: 300;
    line-height: 1.55;
    color: rgba(232,240,250,0.82);
    max-width: 820px;
    margin: 0 auto 40px;
  }

  .tagline strong {
    color: #ffffff;
    font-weight: 500;
  }

  /* efficiency metaphor strip: many dim ticks, few lit */
  .ticks {
    display: flex;
    gap: 9px;
    justify-content: center;
    align-items: center;
    margin-bottom: 40px;
  }
  .tick {
    width: 4px;
    height: 26px;
    border-radius: 2px;
    background: rgba(255,255,255,0.10);
  }
  .tick.on {
    background: #00c8ff;
    box-shadow: 0 0 10px rgba(0,200,255,0.7);
    height: 34px;
  }
  .tick.green {
    background: #00ff99;
    box-shadow: 0 0 10px rgba(0,255,153,0.6);
    height: 34px;
  }

  .availability {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: rgba(232,240,250,0.65);
  }
  .availability .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00ff99;
    box-shadow: 0 0 8px #00ff99;
  }

  /* ── BRAND FOOTER ── */
  .brandmark {
    position: absolute;
    bottom: 38px;
    left: 0; right: 0;
    text-align: center;
    z-index: 2;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: rgba(232,240,250,0.45);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="lines"></div>

  <div class="content">
    <div class="eyebrow">Now Available on AWS Marketplace</div>
    <h1 class="headline">Introducing Autonomic AI<br><span class="brand">AssuredTest</span></h1>

    <div class="ticks">
      <div class="tick"></div><div class="tick"></div><div class="tick on"></div>
      <div class="tick"></div><div class="tick"></div><div class="tick"></div>
      <div class="tick green"></div><div class="tick"></div><div class="tick"></div>
      <div class="tick on"></div><div class="tick"></div><div class="tick"></div>
      <div class="tick"></div><div class="tick on"></div><div class="tick"></div>
      <div class="tick"></div><div class="tick"></div><div class="tick green"></div>
      <div class="tick"></div><div class="tick"></div><div class="tick on"></div>
      <div class="tick"></div><div class="tick"></div>
    </div>

    <p class="tagline">Run only the tests your changes require — <strong>effectively full code coverage</strong>, at a fraction of the compute. Incremental testing, the way incremental compilation transformed builds.</p>

    <div class="availability"><span class="dot"></span>Deterministic. Efficient. Assured.</div>
  </div>

  <div class="brandmark">Autonomic AI</div>
</div>
</body>
</html>
